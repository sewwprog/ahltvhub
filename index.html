  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark;--line:rgba(255,255,255,.12);--muted:#9ba2b4;--accent:#ffae40}
    body{margin:0;min-height:100svh;background:#0b0e15;color:#f6f7fa;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column}
    body:before{content:"";position:fixed;z-index:-1;inset:0;background:radial-gradient(ellipse 48% 38% at 50% 35%,rgba(255,165,56,.09),transparent 85%);pointer-events:none}
    header{height:76px;padding:0 clamp(22px,6vw,90px);display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
    header img{width:35px;height:35px;border-radius:9px;object-fit:cover}
    .brand{font-size:19px;font-weight:850;letter-spacing:1.1px}
    main{width:min(100% - 40px,800px);margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:65px 0 85px}
    .logo{width:112px;height:112px;object-fit:cover;border-radius:25px;box-shadow:0 20px 70px #0008,0 0 0 1px #ffffff22}
    h1{font-size:clamp(40px,8vw,72px);letter-spacing:-2.8px;line-height:1.05;margin:29px 0 13px;font-weight:850}
    .sub{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 38px}
    .links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(100%,580px)}
    .link{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:92px;padding:22px 23px;border:1px solid var(--line);background:#ffffff09;text-decoration:none;color:inherit;border-radius:16px;text-align:left;transition:transform .2s,border-color .2s,background .2s}
    .link:hover{transform:translateY(-4px);background:#ffffff11;border-color:#ffad4077}
    .link strong{display:block;font-size:18px;font-weight:740;letter-spacing:-.4px}
    .link small{display:block;font-size:12px;color:var(--muted);margin-top:6px}
    .arrow{color:var(--accent);font-size:25px;line-height:1}
    footer{text-align:center;padding:25px;font-size:12px;color:#707788}
    @media(max-width:560px){header{height:67px}main{padding:55px 0}.links{grid-template-columns:1fr}.link{min-height:84px}h1{letter-spacing:-1.7px}}
    @media(prefers-reduced-motion:reduce){.link{transition:none}}
  </style>
